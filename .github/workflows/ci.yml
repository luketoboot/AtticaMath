# Every gate the repo already has, actually fired on every push: the
# typecheck+bundle, the unit suite, and the audio reconcile. The screenshot
# harness stays local-only on purpose — its goldens are rasterised on Windows
# and a Linux runner would report every one of them as changed.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test
      - run: npm run audio
